name: thesis

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # Scientific stack
  - numpy
  - pandas
  - scipy
  - matplotlib
  - scikit-learn
  - networkx

  # PyTorch
  - pytorch=2.5.1
  - pytorch-cuda=12.1
  - sympy=1.13.1

  # Geospatial
  - geopandas
  - shapely
  - pyproj
  - contextily

  # OSM
  - osmium-tool
  - pyosmium

  # Utilities
  - jupyter
  - tqdm
  - lxml
  - pip

  # Pip packages
  - pip:
      - osmnx
      - scikit-optimize
      - torch-geometric==2.8.1